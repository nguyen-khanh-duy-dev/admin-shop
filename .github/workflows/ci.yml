name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Kiểm tra format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Kiểm tra type
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
